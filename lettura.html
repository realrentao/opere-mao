<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opere di Mao Tse-tung · 阅读</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="reader">

  <!-- 侧边栏：故事导航 -->
  <aside id="sidebar">
    <div class="side-head">
      <div class="book-title">Opere di Mao Tse-tung</div>
      <div class="book-sub">毛泽东著作 · 意中双语</div>
    </div>
    <div class="side-search">
      <input id="sideSearch" type="text" placeholder="搜索故事…" autocomplete="off">
    </div>
    <nav id="storyNav" aria-label="故事导航"></nav>
    <div class="side-foot" id="sideStats"></div>
  </aside>

  <!-- 主体 -->
  <main id="main">

    <header id="toolbar">
      <button id="btnMenu" class="icon-btn" title="故事目录">☰</button>
      <a class="icon-btn" href="index.html" title="返回全集目录">📚 目录</a>

      <div class="tb-group">
        <span class="tb-label">显示</span>
        <div class="seg" id="modeSeg" role="group" aria-label="显示模式">
          <button data-mode="pair" class="on">对照</button>
          <button data-mode="col">双栏</button>
          <button data-mode="it">仅意语</button>
          <button data-mode="zh">仅中文</button>
        </div>
      </div>

      <div class="tb-group">
        <span class="tb-label">朗读</span>
        <div class="seg" id="langSeg" role="group" aria-label="朗读语言">
          <button data-lang="it" class="on">意语</button>
          <button data-lang="zh">中文</button>
          <button data-lang="alt">意中交替</button>
        </div>
      </div>

      <div class="tb-group">
        <label class="switch" title="当前句播完自动播放下一句">
          <input type="checkbox" id="chkCont"><span>连续播放</span>
        </label>
        <label class="switch" title="播放时自动滚动到当前句">
          <input type="checkbox" id="chkFollow" checked><span>自动滚动</span>
        </label>
        <label class="switch" title="反复朗读当前句">
          <input type="checkbox" id="chkLoop"><span>单句循环</span>
        </label>
      </div>

      <div class="tb-group">
        <span class="tb-label">字号</span>
        <button class="icon-btn sm" id="btnFontDn" title="减小字号">A−</button>
        <button class="icon-btn sm" id="btnFontUp" title="增大字号">A+</button>
      </div>

      <div class="tb-spacer"></div>
      <div class="tb-group tb-progress" id="readProgress"></div>
    </header>

    <div id="reader">
      <div id="content"></div>
      <div id="chapterFoot">
        <a class="nav-btn" id="btnPrev">← 上一篇</a>
        <span id="chapterFootLabel"></span>
        <a class="nav-btn" id="btnNext">下一篇 →</a>
      </div>
    </div>

    <!-- 底部播放器 -->
    <footer id="player">
      <button id="btnPlay" class="play-btn" title="播放 / 暂停（空格）">▶</button>
      <button id="btnPlayAll" class="play-all-btn" title="从第一句连续播放到结尾">▶ 全篇</button>
      <div class="pl-sent">
        <button class="icon-btn sm" id="btnPrevPara" title="上一句（←）">⟨</button>
        <button class="icon-btn sm" id="btnRepeat" title="重复朗读本句（R）">🔁 本句</button>
        <button class="icon-btn sm" id="btnNextPara" title="下一句（→）">⟩</button>
      </div>
      <div class="pl-now">
        <div class="pl-title" id="nowTitle">未在播放</div>
        <div class="pl-sub" id="nowSub">单击任意句子＝朗读该句 · Shift+单击＝从此连读</div>
      </div>
      <div class="pl-seek">
        <span class="time" id="tCur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="播放进度">
        <span class="time" id="tDur">0:00</span>
      </div>
      <div class="pl-speed">
        <span class="tb-label">语速</span>
        <input type="range" id="rate" min="0.5" max="2" step="0.01" value="1" aria-label="语速">
        <output id="rateVal">1.00×</output>
        <button class="icon-btn sm" id="btnRateReset" title="恢复 1.00×">⟲</button>
      </div>
      <audio id="audio" preload="metadata"></audio>
    </footer>

  </main>
</div>

<div id="overlay"></div>

<script src="data/index.js"></script>
<script src="reader.js"></script>
</body>
</html>
